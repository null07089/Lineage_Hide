name: Build Lineage Hide Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lineage-hide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package arm64-v8a module
    runs-on: ubuntu-latest
    # Store ZIP DOS timestamps in the maintainer's timezone so Android tools,
    # which ignore the UT extra field, do not show them eight hours behind.
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_root}" || ! -d "${sdk_root}" ]]; then
            echo 'Android SDK root was not exported by setup-android' >&2
            exit 1
          fi
          export ANDROID_SDK_ROOT="${sdk_root}"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'
          echo "ANDROID_SDK_ROOT=${sdk_root}"
          "$sdk_root/cmake/3.22.1/bin/cmake" --version
          "$sdk_root/ndk/27.2.12479018/ndk-build" --version | head -n 1

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Gradle entry point
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Inject build version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          run_number="${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF_NAME}" == "Dev" || "${GITHUB_REF_NAME}" == "dev" ]]; then
            version="1.1-dev (${run_number}-${short_sha})"
          else
            version="1.1 (${run_number}-${short_sha})"
          fi
          # versionCode is maintained in module.prop so release tags keep the
          # expected value (v2.0 -> 2) and Magisk update checks stay monotonic.
          sed -i "s/^version=.*/version=${version}/" module/module.prop
          echo "Ref: ${GITHUB_REF}"
          echo "Version: $(grep '^version=' module/module.prop)"
          echo "Version code: $(grep '^versionCode=' module/module.prop)"

      - name: Compile release APK/native library
        shell: bash
        run: |
          set -euo pipefail
          echo '[build] ./gradlew :module:assembleRelease'
          ./gradlew :module:assembleRelease --stacktrace --no-daemon

      - name: Package Magisk module
        shell: bash
        run: |
          set -euo pipefail
          echo '[package] bash scripts/package.sh'
          bash scripts/package.sh

      - name: Verify packaged module
        shell: bash
        run: |
          set -euo pipefail
          test -s out/Lineage_Hide.zip
          unzip -l out/Lineage_Hide.zip
          unzip -l out/Lineage_Hide.zip | grep -q 'module.prop'
          unzip -l out/Lineage_Hide.zip | grep -q 'zygisk/arm64-v8a.so'
          unzip -l out/Lineage_Hide.zip | grep -q 'action.sh'
          unzip -l out/Lineage_Hide.zip | grep -q 'customize.sh'
          unzip -l out/Lineage_Hide.zip | grep -q 'ksu_susfs'
          if ! unzip -Z out/Lineage_Hide.zip | grep -Eq '^-rwxr-xr-x.*[[:space:]]ksu_susfs$'; then
            echo '[verify] ksu_susfs is missing or not executable' >&2
            exit 1
          fi
          unzip -p out/Lineage_Hide.zip module.prop | grep -q '^version='
          unzip -p out/Lineage_Hide.zip zygisk/arm64-v8a.so > /tmp/lineage_hide.so
          symbols="$(readelf --wide -Ws /tmp/lineage_hide.so)"
          if ! awk '$4 == "FUNC" && $7 != "UND" && $8 == "zygisk_module_entry" { found=1 } END { exit !found }' <<< "$symbols"; then
            echo '[verify] Zygisk entry point is missing' >&2
            exit 1
          fi
          if ! awk '$4 ~ /^(FUNC|OBJECT)$/ && $7 !~ /^(UND|ABS)$/ && $8 != "zygisk_module_entry" { print; invalid=1 } END { exit invalid }' <<< "$symbols"; then
            echo '[verify] private defined ELF symbols are visible' >&2
            exit 1
          fi
          echo '[verify] package and ELF checks passed'

      - name: Upload module artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lineage_Hide-${{ github.run_id }}
          path: out/Lineage_Hide.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/Lineage_Hide.zip
          generate_release_notes: true

      - name: Sync update manifest to main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version=' module/module.prop | cut -d= -f2-)"
          version_code="$(grep '^versionCode=' module/module.prop | cut -d= -f2-)"
          tag="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B update-manifest origin/main
          cat > update.json <<EOF
          {
            "version": "${version}",
            "versionCode": ${version_code},
            "zipUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Lineage_Hide.zip",
            "changelog": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          }
          EOF
          cat update.json
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json is already current"
          else
            git commit -m "Update update.json for ${tag}"
            git push origin HEAD:main
          fi

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lineage_Hide-diagnostics-${{ github.run_id }}
          path: |
            module/build/outputs/
            module/build/intermediates/cxx/
            module/build/intermediates/stripped_native_libs/
          if-no-files-found: ignore
          retention-days: 7
